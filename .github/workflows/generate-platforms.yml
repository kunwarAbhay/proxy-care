name: Generate native platforms (one-off)

# Generates the android/ and ios/ folders with the pinned Flutter SDK and
# commits them. Run once; removed afterwards.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proxy-care-client
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Generate Android and iOS projects
        run: |
          flutter create --platforms=android,ios --org com.proxycare \
            --project-name proxy_care_client --no-pub .
          git status --short

      - name: Commit android/ and ios/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git commit -m "Generate Android and iOS projects (flutter create)"
          git push
